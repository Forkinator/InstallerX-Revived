name: Manual Stable Release

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Input version tag exactly (e.g. 26.03 or 26.03.01)'
        required: true

jobs:
  build_and_release:
    name: Build Draft Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true

      - name: Setup Signing Keys
        env:
          SIGNING_KEY_STORE_BASE64: ${{ secrets.SIGNING_KEY_STORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          
          if [ -z "${SIGNING_KEY_STORE_BASE64:-}" ] || [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ -z "${SIGNING_KEY_ALIAS:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ]; then
            echo "WARNING: Production signing secrets are missing. Generating a fallback keystore..."
            
            # Generate a temporary self-signed keystore on the fly to avoid build failures
            keytool -genkeypair -v \
              -keystore keystore/carlyu.jks \
              -alias fallbackAlias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass fallbackPassword \
              -keypass fallbackPassword \
              -dname "CN=Fallback, OU=Dev, O=Dev, L=Dev, S=Dev, C=US"
            
            echo "storeFile=keystore/carlyu.jks" > keystore.properties
            echo "keyAlias=fallbackAlias" >> keystore.properties
            echo "keyPassword=fallbackPassword" >> keystore.properties
            echo "storePassword=fallbackPassword" >> keystore.properties
          else
            echo "Production secrets found. Decoding production keystore..."
            echo "${SIGNING_KEY_STORE_BASE64}" | base64 --decode > keystore/carlyu.jks
            echo "storeFile=keystore/carlyu.jks" > keystore.properties
            echo "keyAlias=${SIGNING_KEY_ALIAS}" >> keystore.properties
            echo "keyPassword=${SIGNING_KEY_PASSWORD}" >> keystore.properties
            echo "storePassword=${SIGNING_STORE_PASSWORD}" >> keystore.properties
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Compile explicitly to generate APK files
      - name: Build Release APK
        run: ./gradlew assembleRelease

      # Locate, verify, and rename the output package using the version tag input variable
      - name: Rename Release APK
        run: |
          cd app/build/outputs/apk/release/
          APK_FILE=$(ls *.apk | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: Output APK file was not found during execution."
            exit 1
          fi
          echo "Found compiled package: $APK_FILE"
          mv "$APK_FILE" "app-release-v${{ github.event.inputs.version_tag }}.apk"
          echo "Package successfully updated to app-release-v${{ github.event.inputs.version_tag }}.apk"

      # Upload the cleanly formatted package directly to the GitHub Actions workflow run summary
      - name: Upload Build APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stable-release-apk-v${{ github.event.inputs.version_tag }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7

      # Automatically establish a new repository release draft containing the final custom binary
      - name: Generate Github Release Draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ github.event.inputs.version_tag }}"
          name: "Stable Release v${{ github.event.inputs.version_tag }}"
          body: "Automated manual production release package for version ${{ github.event.inputs.version_tag }}."
          draft: true
          prerelease: false
          files: app/build/outputs/apk/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
